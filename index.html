<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Cartas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Jogo de Cartas</h1>
        <p class="subtitulo">Combine cada termo com o que ele faz.</p>

        <div class="placar">
            <div>Tempo<strong id="tempo">00:00</strong></div>
            <div>Jogadas<strong id="jogadas">0</strong></div>
            <div>Melhor tempo<strong id="melhor">--:--</strong></div>
        </div>

        <div id="tabuleiro" class="tabuleiro"></div>

        <p id="mensagem" class="mensagem"></p>
        <button type="button" id="btnReiniciar" class="btn">Reiniciar</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
